# cheatah-plot — biome manifest.
#
# Marks this repo as a cheatah standard-library extension: dead-simple cross-platform PLOTTING.
# A downstream project runs `biome add cheatah-plot`, then `import plot` and draws. cheatah-plot
# is authored in cheatah (.purr): pure model layers (scale/color/series/stats/figure) on ndarray,
# and its OWN renderer built directly on cheatah-gpu's raw Vulkan/Metal forwarders — headless
# first (PNG out, pixel readback); windowing is roadmap (plot.window).

[project]
name = "cheatah-plot"

[cheatah]
# Toolchain version this extension targets (git tag of the cheatah repo). Bump deliberately.
version = "1.11.4-alpha"

# The renderer dispatches through cheatah-gpu-linalg's device context (which stands on
# cheatah-gpu's raw vk.*/mtl.* forwarders), and device-resident array math rides its linalg
# overloads. Kernels are handed to the context by qualified name — the 0.4.5 contract. biome
# fetches these extensions alongside cheatah-plot.
[dependencies]
cheatah-gpu = ">=0.5.0"
cheatah-gpu-linalg = ">=0.4.5"

# [system-dependencies] — the userspace stack a machine needs to build + run cheatah-plot's GPU
# path. On Linux that is Vulkan (loader/layers, via cheatah-gpu); on macOS it is Apple's NATIVE
# Metal (no Vulkan/MoltenVK) — just Slang. The model layers and the CPU render path need none of
# this. Kernel/GPU drivers are guided by scripts/doctor.sh. Windowing is deliberately ABSENT:
# headless v1 (plot.window will bring its own dependency when it lands).
[system-dependencies]
linux-apt    = ["libvulkan-dev", "vulkan-validationlayers", "vulkan-tools", "glslang-tools", "spirv-tools"]
linux-dnf    = ["vulkan-loader-devel", "vulkan-validation-layers", "vulkan-tools", "glslang", "spirv-tools"]
linux-pacman = ["vulkan-icd-loader", "vulkan-headers", "vulkan-validation-layers", "vulkan-tools", "glslang", "spirv-tools"]
macos-brew   = ["shader-slang"]
# slangc (the Slang shader compiler) ships in the LunarG Vulkan SDK; install-deps.sh points the user
# there if it isn't already on PATH.
slang        = { sdk = "vulkan", url = "https://vulkan.lunarg.com/sdk/home" }
# Provisioned + verified by:
install      = "scripts/install-deps.sh"
doctor       = "scripts/doctor.sh"
